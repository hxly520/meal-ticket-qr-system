<svg width="1180" height="720" viewBox="0 0 1180 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">移动端核销与饭票二维码示意图</title>
  <desc id="desc">展示员工收到饭票二维码图片、饭堂扫码核销成功、员工查看饭卡余额三个移动端页面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1180" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.45" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1180" height="720" rx="34" fill="url(#bg)"/>
  <text x="80" y="80" fill="#0F172A" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="800">移动端闭环</text>
  <text x="80" y="118" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17">企业微信收到二维码图片，饭堂扫码自动核销，员工可查看饭卡余额与低余额提醒</text>

