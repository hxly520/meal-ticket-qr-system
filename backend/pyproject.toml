[project]
name = "meal-ticket-backend"
version = "0.1.0"
description = "Meal ticket QR verification backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "gunicorn>=22.0.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.5",
  "bcrypt==4.0.1",
  "passlib[bcrypt]>=1.7.4",
  "pycryptodome>=3.20.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "qrcode[pil]>=7.4.2",
  "redis>=5.0.8",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
